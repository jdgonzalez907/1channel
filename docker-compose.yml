services:
  postgres:
    image: postgres:18.6-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: password
      POSTGRES_DB: 1channel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  nats:
    image: nats:2.14.6-alpine
    container_name: nats
    command: ["-js", "-sd", "/data"] 
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  nats_data: