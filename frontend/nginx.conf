server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API en el mismo origen. `proxy_pass` SIN barra final para conservar /v1/...
    location /v1/ {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Futuro (fuera de alcance): /webhooks/ (firma del proveedor) y /ws (upgrade).

    # SPA: cualquier ruta desconocida resuelve a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
